name: Deployment 

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'main'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  deploy:
    name: Run Scripts 
    runs-on: chopd3bPrd-linux-small
    env:
       secrets_path: "s3://d3b-684194535433-us-east-1-service-secrets/d3b-flywheel-routine-missing-classifications/app.secrets"
      #  manifest_path: "s3://d3b-study-us-east-1-prd-sd-bhjxbdqk/source/radiology-imaging/s3_manifest.csv"
    steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Installing Requirements 
          run: |
             sudo yum install -y python3-pip
             pip3 install -r requirements.txt
        - name: Set secrets from AWS
          run: |
            aws s3 cp ${{ env.secrets_path }} .
            chmod +x ./app.secrets
            sh ./app.secrets
        - name: Run main script
          run: |
            python3 fw_add_missing_file_classifications_dataView.py